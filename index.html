<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Looking inside assets, then inside css, for style.css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="skills-body">

    <div class="login-card">
        <div class="logo">Skill<span>Sphere</span></div>
        <h2 id="form-title">Sign in</h2>
        <form id="auth-form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submit-btn" class="login-btn">Log In</button>
        </form>
        <p id="toggle-text" class="auth-footer">
            Don't have an account? <a href="#" id="toggle-link">Join now</a>
        </p>
    </div>

    <!-- Looking inside assets, then inside js, for script.js -->
    <script src="assets/js/script.js"></script>
</body>
</html>
