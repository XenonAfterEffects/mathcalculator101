<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalculator - Games</title>
    
    <!-- Link Global CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- REQUIRED: Font Awesome link for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Global Script -->
    <script src="../assets/js/script.js" defer></script>
</head>

<!-- Make sure the body tag has the correct class for styling -->
<body class="games-page"> 
    
    <!-- Top Panel -->
    <div class="panel" id="main-panel">
        <button class="panel-btn" data-page="Home">Home</button>
        <button class="panel-btn" data-page="Games">Games</button>
        <button class="panel-btn" data-page="Apps">Apps</button>
        <button class="panel-btn" data-page="Tv&Movies">Tv/Movies</button>

        <!-- Profile Button -->
        <button class="profile-button">
            <i class="fa-solid fa-user"></i>
        </button>

        <!-- Settings Button -->
        <button class="settings-button">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <!-- Game Grid -->
    <div class="game-grid">
        <!-- FIX: Image paths need to go up two levels to reach assets/images -->
        <div class="game-card game-1" onclick="openGameplay('games/Minecraft1.8.html')">
            <img src="../assets/images/game1.png" alt="Minecraft 1.8" class="game-img-1">
        </div>
        <div class="game-card game-2" onclick="openGameplay('')">
            <img src="../assets/images/game2.png" alt="game 2" class="game-img-2">
        </div>
        <div class="game-card game-3" onclick="openGameplay('')">
            <img src="../assets/images/game3.png" alt="game 3" class="game-img-3">
        </div>
        <div class="game-card game-4" onclick="openGameplay('')">
            <img src="../assets/images/game4.png" alt="game 4" class="game-img-4">
        </div>
        <div class="game-card game-5" onclick="openGameplay('')">
            <img src="../assets/images/game5.png" alt="game 5" class="game-img-5">
        </div>
        <div class="game-card game-6" onclick="openGameplay('games/BasketRandom.html')">
            <img src="../assets/images/game6.png" alt="BasketRandom" class="game-img-6">
        </div>
        <div class="game-card game-7" onclick="openGameplay('')">
            <img src="../assets/images/game7.png" alt="game 7" class="game-img-7">
        </div>
        <div class="game-card game-8" onclick="openGameplay('games/gdash/index.html')">
            <img src="../assets/images/game8.png" alt="GeometryDash" class="game-img-8">
        </div>
        <div class="game-card game-9" onclick="openGameplay('')">
            <img src="../assets/images/game9.png" alt="game 9" class="game-img-9">
        </div>
        <div class="game-card game-10" onclick="openGameplay('')">
            <img src="../assets/images/game10.png" alt="game 10" class="game-img-12">
        </div>
        <div class="game-card game-11" onclick="openGameplay('games/DriftBoss/index.html')">
            <img src="../assets/images/game11.png" alt="DriftBoss" class="game-img-11">
        </div>
        <div class="game-card game-12" onclick="openGameplay('games/MonkeyMart1-master/i-ndex.html')">
            <img src="../assets/images/game12.png" alt="MonkeyMart" class="game-img-12">
        </div>
        <div class="game-card game-13" onclick="openGameplay('')">
            <img src="../assets/images/game13.png" alt="game 13" class="game-img-13">
        </div>
        <div class="game-card game-14" onclick="openGameplay('games/fanf5/index.html')">
            <img src="../assets/images/game14.png" alt="Fnaf5" class="game-img-14">
        </div>
        <div class="game-card game-15" onclick="openGameplay('games/sonic1/index.html')">
            <img src="../assets/images/game15.png" alt="game 15" class="game-img-15">
        </div>
    </div>

    <!-- Gameplay Overlay -->
    <div id="gameplay" class="gameplay-overlay">
        <div class="overlay-controls">
            <button id="closeGameplay">Close</button>
            <button id="fullscreenGameplay">Fullscreen</button>
        </div>
        <iframe id="gameFrame" src="" frameborder="0"></iframe>
    </div>
</body>
</html>
