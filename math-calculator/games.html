<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalculator - Games</title>
    
    <!-- Link Global CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Global Script -->
    <script src="../assets/js/script.js" defer></script>
</head>

<body class="games-page"> 
    
    <!-- Top Panel -->
    <div class="panel" id="main-panel">
        <button class="panel-btn" data-page="Home">Home</button>
        <button class="panel-btn" data-page="Games">Games</button>
        <button class="panel-btn" data-page="Apps">Apps</button>
        <button class="panel-btn" data-page="Tv&Movies">Tv/Movies</button>

        <button class="profile-button">
            <i class="fa-solid fa-user"></i>
        </button>

        <button class="settings-button">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <!-- Game Grid -->
    <div class="game-grid" id="game-grid-container">
        <!-- The script below will automatically fill this with all 816 games -->
    </div>

    <!-- Automatic Game Loader Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('game-grid-container');
            const totalGames = 815; // The repo goes from 0.html to 815.html

            // We use a document fragment to load everything fast without freezing
            const fragment = document.createDocumentFragment();

            for (let i = 0; i <= totalGames; i++) {
                // Create the card div
                const card = document.createElement('div');
                card.className = 'game-card';
                // Set the onclick to open the specific numbered file
                const gamePath = `../assets/games/${i}.html`;
                card.setAttribute('onclick', `openGameplay('${gamePath}')`);

                // Create the image element
                const img = document.createElement('img');
                // You said you'd figure out images later, so we set a default path pattern
                img.src = `../assets/images/game${i}.png`; 
                img.alt = `Game ${i}`; // Temporary name while loading
                
                // --- THE SMART PART: FETCH REAL NAMES ---
                // This fetches the HTML file, finds the <title>, and updates the card
                fetch(gamePath)
                    .then(response => {
                        if (!response.ok) throw new Error("File not found");
                        return response.text();
                    })
                    .then(html => {
                        // Extract title from the HTML content
                        const match = html.match(/<title>(.*?)<\/title>/i);
                        if (match && match[1]) {
                            const realName = match[1].replace('MathCalculator - ', '').trim();
                            img.alt = realName;
                            // Optional: If you want text below the image, uncomment the next line:
                            // card.innerHTML += `<div style="position:absolute; bottom:5px; width:100%; font-size:12px; font-weight:bold; text-shadow:0 0 4px black;">${realName}</div>`;
                        }
                    })
                    .catch(err => {
                        // If file doesn't exist or error, keep generic name
                        console.log(`Skipped game ${i}: ${err.message}`);
                    });

                // Add default error handler for missing images
                img.onerror = function() { 
                    this.src = '../assets/images/placeholder.png'; // Make sure you have a placeholder.png
                };

                card.appendChild(img);
                fragment.appendChild(card);
            }

            // Add all cards to the grid at once
            grid.appendChild(fragment);
        });
    </script>

    <!-- Gameplay Overlay -->
    <div id="gameplay" class="gameplay-overlay">
        <div class="overlay-controls">
            <button id="closeGameplay">Close</button>
            <button id="fullscreenGameplay">Fullscreen</button>
        </div>
        <iframe id="gameFrame" src="" frameborder="0"></iframe>
    </div>

</body>
</html>
