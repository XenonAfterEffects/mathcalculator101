<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalculator - Games</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../assets/js/script.js" defer></script>
</head>

<body class="games-page"> 
    
    <div class="panel" id="main-panel">
        <button class="panel-btn" data-page="Home">Home</button>
        <button class="panel-btn" data-page="Games">Games</button>
        <button class="panel-btn" data-page="Apps">Apps</button>
        <button class="panel-btn" data-page="Tv&Movies">Tv/Movies</button>
        <button class="profile-button"><i class="fa-solid fa-user"></i></button>
        <button class="settings-button"><i class="fa-solid fa-gear"></i></button>
    </div>

    <!-- Game Grid Container -->
    <div class="game-grid" id="game-grid-container">
        <!-- Games will be injected here by the script below -->
    </div>

    <!-- IMPROVED AUTO-LOADER SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('game-grid-container');
            const totalGames = 815; 
            const fragment = document.createDocumentFragment();

            for (let i = 0; i <= totalGames; i++) {
                const gamePath = `../assets/games/${i}.html`;
                
                // 1. Create the Card Container
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = function() { window.openGameplay(gamePath); };

                // 2. Create the Image
                const img = document.createElement('img');
                img.src = `../assets/images/game${i}.png`; 
                // Default placeholder if image fails
                img.onerror = function() { this.src = 'https://via.placeholder.com/150?text=Game'; };

                // 3. Create the Title Text (Loading state)
                const titleDiv = document.createElement('div');
                titleDiv.className = 'game-title';
                titleDiv.textContent = `Game ${i}`; // Default name

                // 4. Append parts to card
                card.appendChild(img);
                card.appendChild(titleDiv);
                fragment.appendChild(card);

                // 5. Fetch the Real Name (Asynchronous)
                fetch(gamePath)
                    .then(res => {
                        if (!res.ok) throw new Error('No File');
                        return res.text();
                    })
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        let title = doc.querySelector('title')?.innerText;

                        if (title) {
                            // Cleanup name: Remove common prefixes like "MathCalculator - "
                            title = title.replace('MathCalculator - ', '').replace('Math Calculator - ', '').trim();
                            
                            // Update the visible text and the image alt
                            titleDiv.textContent = title;
                            img.alt = title;
                        }
                    })
                    .catch(() => {
                        // If fetch fails, keep "Game [i]" as the name
                        // console.log(`Could not load title for game ${i}`);
                    });
            }

            grid.appendChild(fragment);
        });
    </script>

    <div id="gameplay" class="gameplay-overlay">
        <div class="overlay-controls">
            <button id="closeGameplay">Close</button>
            <button id="fullscreenGameplay">Fullscreen</button>
        </div>
        <iframe id="gameFrame" src="" frameborder="0"></iframe>
    </div>
</body>
</html>
