<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalculator - Games</title>
    
    <!-- Link Global CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- REQUIRED: Font Awesome link for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Global Script -->
    <script src="../assets/js/script.js" defer></script>
</head>

<body class="games-page"> 
    
    <!-- Top Panel (Matches Home Page) -->
    <div class="panel" id="main-panel">
        <div class="panel-left">
            <button class="panel-btn" data-page="Home">Home</button>
            <button class="panel-btn" data-page="Games">Games</button>
            <button class="panel-btn" data-page="Apps">Apps</button>
            <button class="panel-btn" data-page="Tv&Movies">Tv/Movies</button>
        </div>

        <div class="panel-right">
            <button class="profile-button">
                <i class="fa-solid fa-user"></i>
            </button>
            <button class="settings-button">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </div>

    <!-- Game Grid (Assigned based on your new assets/games folder) -->
    <div class="game-grid">
        <!-- 1. Minecraft -->
        <div class="game-card" onclick="openGameplay('../assets/games/minecraft1.8.html')">
            <img src="../assets/images/game1.png" alt="Minecraft 1.8">
        </div>

        <!-- 2. Bad Parenting -->
        <div class="game-card" onclick="openGameplay('../assets/games/badparenting1.html')">
            <img src="../assets/images/game2.png" alt="Bad Parenting 1">
        </div>

        <!-- 3. Bitlife -->
        <div class="game-card" onclick="openGameplay('../assets/games/bitlife.html')">
            <img src="../assets/images/game3.png" alt="BitLife">
        </div>

        <!-- 4. Hollow Knight -->
        <div class="game-card" onclick="openGameplay('../assets/games/hollowknight.html')">
            <img src="../assets/images/game4.png" alt="Hollow Knight">
        </div>

        <!-- 5. Jelly Drift -->
        <div class="game-card" onclick="openGameplay('../assets/games/jellydrift.html')">
            <img src="../assets/images/game5.png" alt="Jelly Drift">
        </div>

        <!-- 6. Basket Random -->
        <div class="game-card" onclick="openGameplay('../assets/games/basketrandom.html')">
            <img src="../assets/images/game7.png" alt="">
        </div>

        <!-- 7. Terraria -->
        <div class="game-card" onclick="openGameplay('../assets/games/basketrandom.html')">
            <img src="../assets/images/game7.png" alt="Basket Random">
        </div>

        <!-- Placeholder Slots (8-15) -->
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game8.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game9.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game10.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game11.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game12.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game13.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game14.png" alt="Coming Soon"></div>
        <div class="game-card" onclick="openGameplay('')"><img src="../assets/images/game15.png" alt="Coming Soon"></div>
    </div>

    <!-- Gameplay Overlay -->
    <div id="gameplay" class="gameplay-overlay">
        <div class="overlay-controls">
            <button id="closeGameplay">Close</button>
            <button id="fullscreenGameplay">Fullscreen</button>
        </div>
        <iframe id="gameFrame" src="" frameborder="0"></iframe>
    </div>
</body>
</html>
