<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathCalculator - Home</title>
    
    <!-- Link Global CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- REQUIRED: Font Awesome link for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Global Script -->
    <script src="../assets/js/script.js" defer></script>
</head>

<body class="home-page">
    
    <!-- Top Panel -->
    <div class="panel" id="main-panel">
        <button class="panel-btn" data-page="Home">Home</button>
        <button class="panel-btn" data-page="Games">Games</button>
        <button class="panel-btn" data-page="Apps">Apps</button>
        <button class="panel-btn" data-page="Tv&Movies">Tv/Movies</button>

        <!-- Profile Button -->
        <button class="profile-button">
            <i class="fa-solid fa-user"></i>
        </button>

        <!-- Settings Button -->
        <button class="settings-button">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <!-- Search Bar for Browser Functionality -->
    <div class="browser-search-container">
        <input type="text" id="browser-url-input" placeholder="Enter URL (e.g., google.com)">
        <button id="go-button">Go</button>
    </div>

</body>
</html>`
